[project]
name = "travelplanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=1.0.0",
    "langchain-groq>=0.3.8",
    "langchain-core>=1.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "prisma>=0.15.0",
    "rich>=13.9.0",
    "json-repair>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prisma"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
